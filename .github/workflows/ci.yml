name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Contract behaviour suite (35 checks) and invariant fuzz (750 randomised steps)
        run: npm test

      - name: Frontend syntax check
        run: node --check web/app.js
